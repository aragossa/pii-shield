apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: piipolicies.core.pii-shield.io
spec:
  group: core.pii-shield.io
  names:
    kind: PiiPolicy
    listKind: PiiPolicyList
    plural: piipolicies
    singular: piipolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PiiPolicy is the Schema for the piipolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PiiPolicy
            properties:
              confidenceThreshold:
                description: |-
                  ConfidenceThreshold is the threshold for the PII scanner.
                  Exported to the sidecar as PII_CONFIDENCE_THRESHOLD.
                type: number
              customRegexList:
                description: |-
                  CustomRegexList adds redaction rules on top of the built-in detectors.
                  Exported to the sidecar as JSON in PII_CUSTOM_REGEX_LIST.
                items:
                  description: RegexRule is a named regular expression passed to the
                    scanner.
                  properties:
                    name:
                      description: Name identifies the rule in redaction output and
                        metrics
                      type: string
                    pattern:
                      description: Pattern is an RE2 regular expression
                      minLength: 1
                      type: string
                  required:
                  - pattern
                  type: object
                type: array
              entropyThreshold:
                description: |-
                  EntropyThreshold overrides the scanner entropy threshold.
                  Exported to the sidecar as PII_ENTROPY_THRESHOLD.
                type: number
              failPolicy:
                description: |-
                  FailPolicy determines the sidecar behavior when sanitization fails:
                  "open" passes the raw line through (default), "closed" drops it.
                  Exported to the sidecar as PII_FAIL_POLICY.
                enum:
                - open
                - closed
                type: string
              injectionMode:
                description: |-
                  InjectionMode defines the mode: "file", "pipe", or "ebpf".
                  "pipe" mode is EXPERIMENTAL: it rewrites the target container command
                  through "/bin/sh -c", which can break distroless images (no shell),
                  argument quoting, signal handling, and the app lifecycle. Not
                  recommended for production; see KNOWN_LIMITATIONS.md.
                enum:
                - file
                - pipe
                - ebpf
                type: string
              logPath:
                description: LogPath is the path where the application writes logs
                  (for "file" mode)
                type: string
              minSecretLength:
                description: |-
                  MinSecretLength is the minimum token length considered a secret.
                  Exported to the sidecar as PII_MIN_SECRET_LENGTH.
                minimum: 1
                type: integer
              originalCommand:
                description: |-
                  OriginalCommand is the original app command (for the experimental
                  "pipe" mode); it is executed through "/bin/sh -c"
                type: string
              resources:
                description: Resources allows configuration of compute resources for
                  the injected sidecar
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              safeRegexList:
                description: |-
                  SafeRegexList whitelists matches that must never be redacted.
                  Exported to the sidecar as JSON in PII_SAFE_REGEX_LIST.
                items:
                  description: RegexRule is a named regular expression passed to the
                    scanner.
                  properties:
                    name:
                      description: Name identifies the rule in redaction output and
                        metrics
                      type: string
                    pattern:
                      description: Pattern is an RE2 regular expression
                      minLength: 1
                      type: string
                  required:
                  - pattern
                  type: object
                type: array
              salt:
                description: |-
                  Salt is the deterministic hashing salt, exported to the sidecar as
                  PII_SALT. Use at least 16 characters. Plaintext in the policy object;
                  prefer a Secret reference once available (GH-46 follow-up).
                type: string
              sensitiveKeyPatterns:
                description: |-
                  SensitiveKeyPatterns are case-insensitive regexes matched against keys.
                  Exported to the sidecar as comma-separated PII_SENSITIVE_KEY_PATTERNS.
                items:
                  type: string
                type: array
              sensitiveKeys:
                description: |-
                  SensitiveKeys replaces the scanner's default sensitive key list.
                  Exported to the sidecar as comma-separated PII_SENSITIVE_KEYS.
                items:
                  type: string
                type: array
            required:
            - injectionMode
            type: object
          status:
            description: status defines the observed state of PiiPolicy
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the PiiPolicy resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
