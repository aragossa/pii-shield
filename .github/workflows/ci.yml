name: PII-Shield CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  test:
    name: Test, Lint & Fuzz
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-version-file: 'go.mod'

    - name: Set up Helm
      uses: azure/setup-helm@f0accbfd55e3332a28f721b8202b1016cecf90d5

    - name: Set up QEMU
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
      with:
        platforms: amd64,arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

    - name: Verify Dependencies
      run: go mod verify

    - name: Run actionlint
      uses: reviewdog/action-actionlint@e0207a28405ecad11953ba625a95d92f7889572a

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7
      with:
        version: v2.12.2
        only-new-issues: true

    - name: Run Fuzz Checks (Sanity)
      run: go test -fuzz=FuzzScanner -fuzztime=15s ./pkg/scanner

    - name: Run Tests (Race & Coverage)
      run: go test -race -coverprofile=coverage.out ./...

    - name: Run Operator Tests
      working-directory: operator
      run: go test -v -race -coverprofile=cover.out ./...

    - name: Verify Helm Runtime
      run: scripts/verify-helm-runtime.sh

    - name: Verify multi-arch agent image build
      run: scripts/verify-agent-multiarch-build.sh

    - name: Check Coverage Threshold
      run: |
        go tool cover -func=coverage.out
        total=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
        echo "Total Coverage: $total%"
        if (( $(echo "$total < 70.0" | bc -l) )); then
          echo "❌ Coverage is below 70%"
          exit 1
        fi

  benchmark:
    name: Performance Check
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-version-file: 'go.mod'
    - name: Run Benchmarks
      run: go test -bench=. -benchmem ./pkg/scanner
