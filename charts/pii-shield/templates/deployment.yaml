apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pii-shield.fullname" . }}
  labels:
    {{- include "pii-shield.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pii-shield.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pii-shield.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pii-shield.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: app-logs
          emptyDir: {}
      containers:
        {{- if .Values.demo.enabled }}
        # Demo-only log generator. Production installs should provide their own
        # app container writing to .Values.watchFile on the shared volume.
        - name: log-generator
          image: "{{ .Values.demo.generatorImage.repository }}:{{ .Values.demo.generatorImage.tag }}"
          imagePullPolicy: {{ .Values.demo.generatorImage.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting App Simulator..."
              touch {{ .Values.watchFile | quote }}
              while true; do
                # Generate a mix of normal logs and logs with sensitive data
                echo "[INFO] Processing user request from IP: 192.168.1.1" >> {{ .Values.watchFile | quote }}
                echo "[DEBUG] Database connection established to userdb.internal" >> {{ .Values.watchFile | quote }}
                echo "[WARN] Auth failed for user user@example.com, token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." >> {{ .Values.watchFile | quote }}
                echo "[INFO] Order created successfully. TX-ID: TX-12345, CC: 4111 2222 3333 4444" >> {{ .Values.watchFile | quote }}
                echo "----" >> {{ .Values.watchFile | quote }}
                sleep 2
              done
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
        {{- end }}

        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /pii-shield
          args:
            - --watch-file
            - {{ .Values.watchFile | quote }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: http-metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          env:
            {{- if .Values.piiConfig.saltSecret.name }}
            - name: PII_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.piiConfig.saltSecret.name | quote }}
                  key: {{ .Values.piiConfig.saltSecret.key | quote }}
            {{- else if .Values.piiConfig.salt }}
            - name: PII_SALT
              value: {{ .Values.piiConfig.salt | quote }}
            {{- end }}
            - name: PII_REQUIRE_STRONG_SALT
              value: {{ .Values.piiConfig.requireStrongSalt | quote }}
            - name: PII_ENTROPY_THRESHOLD
              value: {{ .Values.piiConfig.entropyThreshold | quote }}
            - name: PII_MIN_SECRET_LENGTH
              value: {{ .Values.piiConfig.minSecretLength | quote }}
            {{- if .Values.piiConfig.sensitiveKeys }}
            - name: PII_SENSITIVE_KEYS
              value: {{ .Values.piiConfig.sensitiveKeys | quote }}
            {{- end }}
            - name: PII_ADAPTIVE_THRESHOLD
              value: {{ .Values.piiConfig.adaptiveThreshold | quote }}
            - name: PII_FAIL_POLICY
              value: {{ .Values.piiConfig.failPolicy | quote }}
            {{- if .Values.piiConfig.customRegexList }}
            - name: PII_CUSTOM_REGEX_LIST
              value: {{ .Values.piiConfig.customRegexList | quote }}
            {{- end }}
            {{- if .Values.piiConfig.safeRegexList }}
            - name: PII_SAFE_REGEX_LIST
              value: {{ .Values.piiConfig.safeRegexList | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: PII_METRICS_ENABLED
              value: "true"
            - name: PII_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
