replicaCount: 1

image:
  repository: thelisdeep/pii-shield
  pullPolicy: IfNotPresent
  tag: "2.0.5"

watchFile: /var/log/app/output.log

demo:
  enabled: false
  generatorImage:
    repository: alpine
    pullPolicy: IfNotPresent
    tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
  # prometheus.io/scrape: "true"
  # prometheus.io/port: "9090"

podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    cpu: 50m
    memory: 30Mi
  requests:
    cpu: 50m
    memory: 30Mi

# PII-Shield Configuration
piiConfig:
  # PII_SALT: Random byte string used for HMAC hashing. Recommended to set for persistent hashes.
  salt: ""

  # PII_REQUIRE_STRONG_SALT: Reject explicitly configured salts shorter than 16 bytes
  requireStrongSalt: "false"
  
  # Configuration tuning
  # PII_ENTROPY_THRESHOLD: Shannon entropy threshold (3.0 - 8.0)
  entropyThreshold: "3.6"
  
  # PII_MIN_SECRET_LENGTH: Minimum length of a string to be considered a candidate token
  minSecretLength: "6"
  
  # PII_SENSITIVE_KEYS: Comma-separated list of keys to always redact values for
  sensitiveKeys: "password,secret,token,key,api_key"
  
  # PII_ADAPTIVE_THRESHOLD: Enable statistical learning
  adaptiveThreshold: "false"

  # PII_FAIL_POLICY: open keeps log flow alive on processing failure; closed emits drop markers
  failPolicy: "open"

  # PII_CUSTOM_REGEX_LIST: JSON array of regex objects to enforce redaction
  # Example: '[{"pattern": "^TX-\\d{5}$", "name": "TX"}]'
  customRegexList: ""

  # PII_SAFE_REGEX_LIST: JSON array of regex objects to ignore
  safeRegexList: ""

nodeSelector: {}

tolerations: []

affinity: {}

# Observability Configuration
metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: false
    # namespace: monitoring
    # labels:
    #   release: prometheus
  prometheusRule:
    enabled: false
    # namespace: monitoring
    labels: {}
    alertLabels: {}
    targetDownFor: 5m
    restartThreshold: 0
    restartFor: 5m
    errorRateThreshold: 0
    errorRateFor: 10m
    p95LatencySeconds: 0.05
    latencyFor: 10m
    noThroughputFor: 30m

# Operator configuration
legacySidecarMode: false
